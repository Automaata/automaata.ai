name: Bootstrap GitHub Pages
# One-time check of the Pages configuration. Safe to delete once the site is live.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report Pages configuration
        run: |
          out=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1 || true)
          echo "::notice title=GET pages::$(echo "$out" | tr -d '\n' | cut -c1-600)"
          out2=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/' 2>&1 || true)
          echo "::notice title=POST pages::$(echo "$out2" | tr -d '\n' | cut -c1-600)"
          out3=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1 || true)
          echo "::notice title=GET pages after::$(echo "$out3" | tr -d '\n' | cut -c1-600)"
