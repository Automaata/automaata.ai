name: Bootstrap GitHub Pages
# One-time check of the Pages configuration. Safe to delete once the site is live.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report Pages configuration
        run: |
          json=$(gh api "repos/${GITHUB_REPOSITORY}/pages")
          echo "::notice title=Pages config::$(echo "$json" | jq -c '{status, cname, html_url, https_enforced, protected_domain_state, build_type, source}')"
          build=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')
          echo "::notice title=Latest build::$(echo "$build" | jq -c '{status, error: .error.message, created_at, updated_at}')"
